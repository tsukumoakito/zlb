<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#1a1b26" />
  <!-- Double Frame -->
  <rect x="37" y="37" width="1126" height="326" rx="35" fill="none" stroke="#ff6f00" stroke-width="6" />
  <rect x="57" y="57" width="1086" height="286" rx="25" fill="none" stroke="#ff6f00" stroke-width="2" opacity="0.8" />
  <!-- Benchmark Bars Symbol (Condensed with Orange Outlines) -->
  <g stroke="#ff6f00" stroke-width="2">
    <rect x="180" y="250" width="50" height="75" rx="5" fill="#444444" />
    <rect x="245" y="187" width="50" height="138" rx="5" fill="#ffffff" />
    <rect x="310" y="112" width="50" height="213" rx="5" fill="#ff6f00" />
  </g>
  <!-- Text Block (Recalculated for Boldness & Proximity) -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">
    <!-- Main Title: ZLB (Ultra Bold with Shadow) -->
    <text x="758" y="248" font-size="200" fill="black" stroke="black" stroke-width="8">ZLB</text>
    <text x="750" y="240" font-size="200" fill="#ff6f00" stroke="#ff6f00" stroke-width="8">ZLB</text>
    <!-- Subtitle: Positioned for tight grouping -->
    <text x="750" y="315" font-size="42" fill="#ffffff" letter-spacing="1">Zig Language Benchmark</text>
  </g>
</svg>
